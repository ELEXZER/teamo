<!DOCTYPE html>
<html lang="es">
<head>

    <title>Para Melany 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="canvas"></canvas>

    <div id="inicio" class="pantalla">
        <div class="contenido">
            <p class="pequeno">Tengo algo que mostrarte...</p>
            <h1>Para Melany 🌷</h1>
            <p>Desliza hacia arriba para comenzar</p>
            <div class="flecha">↓</div>
        </div>
    </div>

   <div id="mensaje" class="mensaje oculto">

    <div class="carta">

        <div class="flor-final">🌷</div>

        <h2>Para ti, Melany</h2>

        <p>
            Entre tantas flores,
            hay unas que tienen un significado
            especial para ti.
        </p>

        <p>
            Por eso quise hacerte
            este pequeño lugar,
            lleno de lirios solamente para ti.
        </p>

        <p class="firma">
            — Diego
        </p>

        <button id="reiniciar">
            Volver a caminar 🌷
        </button>

    </div>

</div>

    <script src="script.js"></script>
